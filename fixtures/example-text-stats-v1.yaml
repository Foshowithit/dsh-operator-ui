# example-text-stats-v1.yaml — EXAMPLE capability workflow (not SEEDED, not production).
#
# A real, useful, zero-credential workflow: measures README.txt in the run
# workspace and reports the result as OPERATOR-LEGIBLE evidence — labeled
# lines, not raw tool output. Rule (M0 walkthrough adjudication): a
# capability is responsible for producing evidence a person can read; the
# generic UI renders the evidence contract, it never parses tool dialects.
#
# Lifecycle honesty: shipped as a registry CANDIDATE — it has not passed a
# promotion gate, so derived routing eligibility reads CONDITIONAL with
# reasons. That is the point: the UI shows the truth, not optimism.

name: example-text-stats-v1
description: >
  EXAMPLE text-stats capability: reports Lines / Words / Bytes of
  README.txt in the run workspace (deterministic, zero-credential).

nodes:
  - id: measure
    bash: >
      echo "README.txt";
      echo "Lines: $(wc -l < README.txt)";
      echo "Words: $(wc -w < README.txt)";
      echo "Bytes: $(wc -c < README.txt)"

  - id: report
    depends_on: [measure]
    bash: echo 'example-text-stats:done'
