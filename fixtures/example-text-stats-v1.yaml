# example-text-stats-v1.yaml — EXAMPLE capability workflow (not SEEDED, not production).
#
# A real, useful, zero-credential workflow: counts lines/words/bytes of a
# target text file in the run workspace. It exists so a fresh installation
# has honest non-seeded intelligence to give work to (the seeded verify-echo
# proves the machinery; THIS is the kind of thing a user would run).
#
# Lifecycle honesty: shipped as a registry CANDIDATE — it has not passed a
# promotion gate, so the derived routing eligibility reads CONDITIONAL with
# reasons. That is the point: the UI shows the truth, not optimism.

name: example-text-stats-v1
description: >
  EXAMPLE text-stats capability: counts lines, words, and bytes of
  README.txt in the run workspace (deterministic, zero-credential).

nodes:
  - id: measure
    bash: wc README.txt

  - id: report
    depends_on: [measure]
    bash: echo 'example-text-stats:done'
